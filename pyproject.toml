[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spherex-sky-diary"
version = "0.1.0"
description = "SPHEREx Sky Diary - NASA Space Apps Challenge 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "astropy>=6.0.0",
    "photutils>=1.10.0",
    "reproject>=0.13.0",
    "astroquery>=0.4.7",
    "pytest>=7.4.0",
    "jsonschema>=4.20.0",
    "pyyaml>=6.0.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

